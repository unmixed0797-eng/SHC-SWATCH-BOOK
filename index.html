const SHELF_NAME = { A: '책장 A (NEXT WEEK NEW STYLE CFM SHOE)', B: '책장 B (휴대폰 보관함 옆)' };

function norm(s) { return String(s||'').replace(/[\s\-\/]/g,'').toUpperCase(); }

function doSearch() {
    const raw = document.getElementById('searchInput').value.trim();
    if (!raw) return;
    const q = norm(raw);
    const hit = ITEMS.find(it => norm(it.s) === q) || ITEMS.find(it => norm(it.s).includes(q));
    const area = document.getElementById('resultArea');
    if (!hit) {
        area.innerHTML = `<div class="not-found">❌ [${raw}] 번호의 스와치북을 찾을 수 없습니다.</div>`;
        return;
    }
    const w = hit.w;
    const wname = WEEK_NAME[w] || w;
    const wlabel = w.replace('.','/');
    const loc = LOC[w];
    if (!loc) {
        area.innerHTML = `
        <div class="result-box">
            <div class="result-header">
                <div class="style-num">[${hit.s}]</div>
                <div class="week-badge">${wlabel}</div>
                <div class="week-text">${wname}</div>
                <div class="shelf-name">아직 책장에 배치되지 않은 주차입니다</div>
            </div>
        </div>`;
        return;
    }
    // 다중 위치(예: 5.2, 5.3) 지원: 배열의 첫 요소가 배열이면 다중
    const positions = Array.isArray(loc[0]) ? loc : [loc];
    const shelf = positions[0][0];
    const highlights = positions.map(p => 
        `<div class="highlight" style="left:${p[1]}%; top:${p[2]}%; width:${p[3]}%; height:${p[4]}%;"></div>`
    ).join('');
    area.innerHTML = `
    <div class="result-box">
        <div class="result-header">
            <div class="style-num">[${hit.s}]</div>
            <div class="week-badge">${wlabel}</div>
            <div class="week-text">${wname}</div>
            <div class="shelf-name">${SHELF_NAME[shelf]}</div>
        </div>
        <div class="photo-wrap">
            <img src="${IMG[shelf]}" alt="책장 사진">
            ${highlights}
        </div>
        <div class="hint">깜박이는 빨간 박스 위치에서 스와치북을 확인하세요</div>
    </div>`;
}

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});

function startMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('구글 크롬(Chrome) 브라우저를 사용해 주세요.'); return; }
    const rec = new SR();
    rec.lang = 'en-US';
    rec.onresult = e => {
        document.getElementById('searchInput').value = e.results[0][0].transcript;
        doSearch();
    };
    rec.start();
}
</script>
